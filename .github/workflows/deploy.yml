name: Deploy bloatware-site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Get Hugging Face Dataset HEAD SHA
        id: hf-sha
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          SHA=$(git -c http.extraHeader="Authorization: Bearer $HF_TOKEN" ls-remote "https://huggingface.co/datasets/$HF_DATASET_REPO" HEAD | cut -f1)
          if [ -z "$SHA" ]; then
            echo "Error: Could not retrieve HEAD SHA from Hugging Face repository."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Hugging Face Dataset HEAD SHA: $SHA"

      - name: Cache Hugging Face Content
        id: cache-content
        uses: actions/cache@v4
        with:
          path: content
          key: hf-content-${{ steps.hf-sha.outputs.sha }}
          restore-keys: |
            hf-content-

      - name: Sync Hugging Face Content on Cache Miss
        if: steps.cache-content.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          if [ -d "content/.git" ]; then
            echo "Cache restored older version. Fast-forwarding latest changes..."
            cd content
            git -c http.extraHeader="Authorization: Bearer $HF_TOKEN" fetch --depth 1 origin main
            git reset --hard origin/main
          else
            echo "No cache found. Performing fresh shallow clone..."
            rm -rf content
            git -c http.extraHeader="Authorization: Bearer $HF_TOKEN" clone --depth 1 "https://huggingface.co/datasets/$HF_DATASET_REPO" content
          fi

      - name: Build static site
        working-directory: site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
